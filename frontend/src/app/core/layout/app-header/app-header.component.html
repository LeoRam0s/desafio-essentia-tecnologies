<header class="site-header">
  <div class="site-header__inner">
    <img src="/assets/logo-essentia.png" alt="Essentia" width="56" height="56" />
    <div class="site-header__account">
      <span class="site-header__user">{{ userName }}</span>
      <button
        class="logout-button"
        type="button"
        aria-label="Sair da conta"
        title="Sair"
        [disabled]="isLoggingOut"
        (click)="logout()"
      >
        <svg
          viewBox="0 0 24 24"
          width="21"
          height="21"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 3h11v18H4z" />
          <path d="M10 12h11m0 0-4-4m4 4-4 4" />
        </svg>
      </button>
    </div>
  </div>
</header>
