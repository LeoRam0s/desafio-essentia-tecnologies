<div class="form-field">
  <label [for]="id">{{ label }}</label>
  <!-- A div só existe se for do tipo password input de senha, adiciona botao de exibir senha -->
  <div [class.password-input]="type === 'password'"> 
    <input
      [id]="id"
      [type]="inputType"
      [value]="value"
      [disabled]="disabled"
      [attr.autocomplete]="autocomplete"
      [attr.aria-invalid]="hasVisibleError ? 'true' : null"
      [attr.aria-describedby]="hasVisibleError ? errorId : null"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />

    @if (type === 'password') {
      <button
        type="button"
        class="password-toggle"
        [attr.aria-label]="passwordVisible ? 'Ocultar senha' : 'Exibir senha'"
        [attr.aria-pressed]="passwordVisible"
        [attr.aria-controls]="id"
        [disabled]="disabled"
        (click)="togglePasswordVisibility()"
      >
        {{ passwordVisible ? 'Ocultar' : 'Exibir' }}
      </button>
    }
  </div>

  @if (hasVisibleError) {
    <p [id]="errorId" class="form-error" role="alert">{{ errorMessage }}</p>
  }
</div>
