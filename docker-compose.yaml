services:
  mysql:
    image: mysql:8.4
    container_name: mysql_essential_tech
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - '${DB_PORT}:3306'
  mysql-test:
    image: mysql:8.4
    container_name: mysql_essential_tech_test
    profiles: ['test']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:3306'
  redis:
    image: redis:alpine
    container_name: redis_essential_tech
    command: [
        'redis-server', # Command to run Redis server
        '--maxmemory', # Set maximum memory usage
        '100mb', # Limit Redis memory to 100MB (entorno de 30k tokens)
        '--maxmemory-policy', # policy for handling memory limits
        'allkeys-lru', # remove least recently used keys when memory limit is reached
        '--requirepass',
        '${REDIS_PASSWORD}', # Password for Redis server
      ]
    restart: always
    ports:
      - '${REDIS_PORT}:6379'
  mongo:
    image: mongo:8.0
    container_name: mongo_essential_tech
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    ports:
      - '27017:27017'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval 'db.adminCommand("ping").ok'
      interval: 5s
      timeout: 5s
      retries: 10
